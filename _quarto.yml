project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**"
    - "!private-notes/**"

website:
  title: "Dynamics to Intelligence"
  site-url: https://anqatech.github.io/myblog/
  description: "Modelling and controlling complex physical systems—from space structures to world models."
  open-graph: true
  search: true
  navbar:
    pinned: true
    title: "Dynamics to Intelligence"
    left:
      - text: "Field Notes"
        href: index.qmd#field-notes
    right:
      - text: "About"
        href: about.qmd
  page-footer:
    left: "Dynamics to Intelligence"
    right: "Models are where understanding becomes control."
format:
  html:
    theme:
      - theme.scss
    css: styles.css
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
